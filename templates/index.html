<!doctype html><meta charset="utf-8"><title>Subtitle Alignment</title><style>body{font:15px system-ui;max-width:1100px;margin:30px auto}td{padding:10px;border-bottom:1px solid #ddd}.muted{color:#777}button{margin:2px 4px 2px 0}dialog{width:80%;background:#111;color:#eee}video{width:100%}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style><h1>Missing subtitles</h1><p id="status" class="muted"></p><table><tbody id="rows"></tbody></table><dialog id="preview"><h2 id="ptitle"></h2><video id="player" controls></video><div class="toolbar"><button onclick="nudge(-.1)">−100 ms</button><button onclick="nudge(-.05)">−50 ms</button><span id="offset">0 ms</span><button onclick="nudge(.05)">+50 ms</button><button onclick="nudge(.1)">+100 ms</button><button onclick="decide('reject')">Reject / next candidate</button><button onclick="decide('approve')">Approve & save</button><button onclick="closePreview()">Cancel</button><label><input id="autoAlign" type="checkbox" checked onchange="refreshTrack()"> Auto alignment</label></div></dialog><script>
let current=null,off=0;const esc=s=>s.replaceAll('\\','\\\\').replaceAll("'","\\'");
async function load(){let r=await fetch('/api/movies'),d=await r.json();status.textContent=`${d.movies.length} movies need subtitles · OpenSubtitles lookups: ${d.lookups}/${d.limit}`;rows.innerHTML=d.movies.map(m=>`<tr><td>${m.title}</td><td>${m.vad?.cached?'voice data cached':'not analyzed'}</td><td><button onclick="analyze('${esc(m.path)}')">${m.vad?.cached?'Re-analyze':'Analyze voice'}</button><button ${m.vad?.cached?'':'disabled'} onclick="search('${esc(m.path)}')">Find subtitle</button>${m.working_srt?`<button onclick="openPreview('${esc(m.path)}','${esc(m.title)}')">Preview</button>`:''}</td></tr>`).join('')}
async function analyze(path){status.textContent='Analyzing audio…';await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path})});load()}async function search(path){let r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path})});let d=await r.json();if(!r.ok)return alert(d.error);let f=prompt('Candidate download id (blank = top result)',d.candidates?.[0]?.download_id||'');if(f===null)return;let x=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path,file_id:f||undefined})});if(!x.ok)alert((await x.json()).error);load()}
function openPreview(path,title){current=path;off=0;ptitle.textContent=title;player.src='/api/video?path='+encodeURIComponent(path);autoAlign.checked=true;refreshTrack();offset.textContent='0 ms';preview.showModal()}function refreshTrack(){let old=player.querySelector('track');if(old)old.remove();let t=document.createElement('track');t.kind='subtitles';t.default=true;t.src='/api/subtitles?path='+encodeURIComponent(current)+'&offset='+off+'&auto='+(autoAlign.checked?'1':'0');player.appendChild(t)}function nudge(x){off+=x;offset.textContent=Math.round(off*1000)+' ms';refreshTrack()}function closePreview(){player.pause();player.removeAttribute('src');player.load();preview.close()}async function decide(action){let r=await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:current,action,offset:off,auto_alignment:autoAlign.checked})});let d=await r.json();if(!r.ok){alert(d.error);return}if(action==='reject'){off=0;offset.textContent='0 ms';refreshTrack();player.play().catch(()=>{});alert('Loaded next candidate: '+(d.candidate||'next result'));}else{closePreview();load()}}load();</script>
