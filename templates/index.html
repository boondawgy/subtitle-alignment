<!doctype html><meta charset="utf-8"><title>Subtitle Alignment</title><style>body{font:15px system-ui;margin:24px}.muted{color:#777}.analyzing{opacity:.5}.spinner{display:inline-block;width:12px;height:12px;margin-right:7px;border:2px solid #bbb;border-top-color:#333;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}@keyframes spin{to{transform:rotate(360deg)}}button{margin:2px 4px 2px 0}.topbar{display:flex;align-items:center;gap:14px}dialog{box-sizing:border-box;width:90%;max-width:1400px;max-height:calc(100dvh - 32px);background:#111;color:#eee;overflow:auto}dialog[open]{display:flex;flex-direction:column}dialog h2{flex:none;margin:0 0 12px}.preview-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;min-height:0;flex:1}.preview-layout section{display:flex;flex-direction:column;min-height:0;min-width:0}.cue-panel{box-sizing:border-box;border:1px solid #777;padding:10px;min-height:0;overflow:auto}.cue-panel input{box-sizing:border-box;width:100%;padding:8px;margin-bottom:8px}.subtitle-name{box-sizing:border-box;width:100%;margin:4px 0 10px;padding:7px;color:#222;background:#fff}.cue{cursor:pointer;color:#222;border:1px solid #aaa;border-radius:5px;padding:10px;margin:8px 0;background:#fafafa}.cue button{font-size:12px;color:#111}.cue.active{border-color:#3973b9;background:#eef5ff}video{display:block;width:100%;min-height:0;max-height:calc(100dvh - 180px);object-fit:contain;flex:1}.toolbar{flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}@media(max-width:800px){.preview-layout{grid-template-columns:1fr;grid-template-rows:minmax(80px,30vh) minmax(0,1fr)}video{max-height:35vh}}</style><div class="topbar"><h1>Missing subtitles</h1><button onclick="refreshLibrary()">Refresh library</button><label for="movieSort">Sort by</label><select id="movieSort" onchange="load()"><option value="title">Title</option><option value="score-desc">Fit score: highest first</option><option value="score-asc">Fit score: lowest first</option></select></div><p id="status" class="muted"></p><p id="apiUsage" class="muted" aria-live="polite">OpenSubtitles API calls remaining: unknown</p><table><tbody id="rows"></tbody></table><dialog id="preview"><h2 id="ptitle"></h2><div class="preview-layout"><aside class="cue-panel"><label for="currentSubtitleName">Subtitle track</label><select id="currentSubtitleName" class="subtitle-name" onchange="switchTrack(this.value)" aria-label="Subtitle track"></select><input id="previewCueSearch" placeholder="Search subtitle text…" oninput="renderCues()"><div id="previewCueList"></div></aside><section><p id="videoStatus" class="muted" hidden></p><video id="player" controls></video><div class="toolbar"><button onclick="nudge(-1)">Earlier 1 s</button><button onclick="nudge(-.1)">Earlier 100 ms</button><span id="offset">0 ms</span><button onclick="nudge(.1)">Later 100 ms</button><button onclick="nudge(1)">Later 1 s</button><button onclick="decide('reject')">Reject / next candidate</button><button onclick="decide('approve')">Approve & save</button><button onclick="closePreview()">Cancel</button><label title="Automatic alignment is not yet available"><input id="autoAlign" type="checkbox" disabled> Auto alignment (unavailable)</label></div></section></div></dialog><script>
let current=null,off=0,cues=[];const esc=s=>s.replaceAll('\\','\\\\').replaceAll("'","\\'");const fmt=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('[br]','<br>').replaceAll('\n','<br>');
let pollTimer;
async function load(){
  clearTimeout(pollTimer);
  try {
    const r=await fetch('/api/movies'), d=await r.json();
    const pending=d.movies.filter(m=>m.scan_status==='analyzing').length;
    const ready=d.movies.filter(m=>m.scan_status==='ready'&&!m.has_subtitles).length;
    const rate=d.rate_remaining != null ? `${d.rate_remaining}${d.rate_limit != null ? '/'+d.rate_limit : ''}` : 'unknown until an API response reports it';
    const downloads=d.downloads_remaining != null ? d.downloads_remaining : 'unknown until a download reports it';
    const recorded=t=>t ? ` as of ${new Date(t).toLocaleString()}` : ' (previously recorded; time unknown)';
    apiUsage.textContent=`Last API rate response: ${rate}${d.rate_remaining != null ? recorded(d.rate_updated_at) : ''} · Last reported downloads remaining: ${downloads}${d.downloads_remaining != null ? recorded(d.downloads_updated_at) : ''}`;
    const progress=d.scanning ? `Refreshing library: ${d.scan_progress.phase === 'discovering' ? 'finding movies' : 'checking subtitles'} · ${d.scan_progress.found} found · ${d.scan_progress.checked} checked${d.scan_progress.current ? ' · Checking '+d.scan_progress.current : ''} · ` : '';
    status.textContent=`${progress}${ready} movies need subtitles${pending?` · ${pending} still being checked`:''}${d.scan_error?' · '+d.scan_error:''}`;
    rows.replaceChildren();
    const visible=d.movies.filter(m=>!m.has_subtitles);
    visible.sort((a,b)=>{
      const titleOrder=a.title.localeCompare(b.title, undefined, {sensitivity:'base',numeric:true});
      if(movieSort.value==='title') return titleOrder;
      if(a.best_fit_score == null && b.best_fit_score != null) return 1;
      if(a.best_fit_score != null && b.best_fit_score == null) return -1;
      if(a.best_fit_score == null) return titleOrder;
      const scoreOrder=movieSort.value==='score-desc' ? b.best_fit_score-a.best_fit_score : a.best_fit_score-b.best_fit_score;
      return scoreOrder || titleOrder;
    });
    for(const m of visible){
      const tr=document.createElement('tr'), busy=m.scan_status!=='ready'; tr.className=busy?'analyzing':'';
      const title=document.createElement('td'); title.textContent=m.title;
      const state=document.createElement('td');
      if(m.scan_status==='analyzing'){const spinner=document.createElement('span');spinner.className='spinner';state.append(spinner,'Checking subtitles…')}
      else state.textContent=m.scan_status==='error'?'Subtitle check failed: '+m.scan_error:'Subtitles missing';
      const cell=document.createElement('td'), button=document.createElement('button');button.textContent='Preview';button.disabled=busy;button.onclick=()=>previewMovie(m.path,m.title);const details=document.createElement('span');details.textContent=` · Best fit: ${m.best_fit_score != null ? m.best_fit_score+'/100' : 'not scored'} · ${m.track_count} ${m.track_count===1?'track':'tracks'}`;cell.append(button,details);tr.append(title,state,cell);rows.append(tr);
    }
    if(d.scanning) pollTimer=setTimeout(load,2000);
  } catch(e) { status.textContent='Unable to load library: '+e.message; }
}
async function refreshLibrary(){status.textContent='Refreshing library…';try{await fetch('/api/refresh',{method:'POST'});await load()}catch(e){status.textContent='Refresh failed: '+e.message}}
async function previewMovie(path,title){const saved=await fetch('/api/cues?path='+encodeURIComponent(path));if(saved.ok){const existing=await saved.json();if(existing.tracks?.length){const scored=existing.tracks.filter(t=>t.fit_score!=null).sort((a,b)=>b.fit_score-a.fit_score);if(scored.length&&String(scored[0].id)!==String(existing.current_id)){const selected=await fetch('/api/select-track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path,id:scored[0].id})});if(!selected.ok){alert((await selected.json()).error||'Could not select subtitle track');return}}openPreview(path,title,true);return}}status.textContent='Finding and downloading the highest-ranked subtitle…';let r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path})});let d=await r.json();if(!r.ok){load();return alert(d.error)}if(!d.candidates?.length){load();return alert('No subtitle candidates found')};let x=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path,file_id:d.candidates[0].download_id})});if(!x.ok){const error=(await x.json()).error;load();return alert(error)}load();openPreview(path,title,true)}async function openPreview(path,title,autoplay){current=path;off=0;ptitle.textContent=title;videoStatus.hidden=true;autoAlign.checked=false;let r=await fetch('/api/cues?path='+encodeURIComponent(path));let d=await r.json();updateCueData(d);applyRecommendedOffset(d);refreshTrack();preview.showModal();prepareVideo(path,autoplay)}async function prepareVideo(path,autoplay){try{while(preview.open&&current===path){const response=await fetch('/api/preview-video?path='+encodeURIComponent(path));const data=await response.json();if(!response.ok||data.status==='error')throw new Error(data.error||'Could not prepare video');if(data.status==='ready'){videoStatus.hidden=true;player.src='/api/video?path='+encodeURIComponent(path)+(data.converted?'&compatible=1':'');if(autoplay)player.play().catch(()=>{});return}videoStatus.hidden=false;videoStatus.textContent='Preparing browser-compatible audio for this movie. This can take a few minutes…';await new Promise(resolve=>setTimeout(resolve,2000))}}catch(error){videoStatus.hidden=false;videoStatus.textContent=error.message}}function updateCueData(data){
  cues=data.cues||[];
  currentSubtitleName.replaceChildren();
  for(const [index,track] of (data.tracks||[]).entries()){
    const option=document.createElement('option');
    option.value=track.id; option.textContent=`${index+1}. ${track.name} (${track.fit_score != null ? track.fit_score+'/100' : 'not scored'})`;
    option.selected=String(track.id)===String(data.current_id);
    currentSubtitleName.append(option);
  }
  renderCues();
}
function applyRecommendedOffset(data){const track=(data.tracks||[]).find(t=>String(t.id)===String(data.current_id));off=track?.recommended_offset_seconds ?? 0;offset.textContent=Math.round(off*1000)+' ms'}
async function switchTrack(id){
  try{
    const response=await fetch('/api/select-track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:current,id})});
    const result=await response.json();
    if(!response.ok) throw new Error(result.error);
    const cuesResponse=await fetch('/api/cues?path='+encodeURIComponent(current));
    if(!cuesResponse.ok) throw new Error('Could not load subtitle cues');
    const data=await cuesResponse.json();updateCueData(data);applyRecommendedOffset(data);refreshTrack();
  }catch(error){alert(error.message);const response=await fetch('/api/cues?path='+encodeURIComponent(current));updateCueData(await response.json())}
}
function renderCues(){let q=previewCueSearch.value.toLowerCase();let html=cues.map((c,i)=>({c,i})).filter(x=>x.c.text.toLowerCase().includes(q)).map(x=>`<div class="cue" id="cue-${x.i}" onclick="seekCue(${x.i})"><div>${fmt(x.c.text)}</div><button onclick="event.stopPropagation();pinCue(${x.i})">Pin to current position</button></div>`).join('')||'<span class="muted">No matching segments.</span>';previewCueList.innerHTML=html}function seekCue(i){player.currentTime=Math.max(0,cues[i].start+off)}function pinCue(i){let c=cues[i];off=player.currentTime-c.end;offset.textContent=Math.round(off*1000)+' ms';refreshTrack();document.querySelectorAll('.cue').forEach(x=>x.classList.remove('active'));document.getElementById('cue-'+i)?.classList.add('active')}
document.addEventListener('keydown', event=>{
  if(!preview.open || event.ctrlKey || event.metaKey || event.altKey || event.isComposing) return;
  const target=event.target;
  if(target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName)) return;
  const actions={ArrowLeft:()=>player.currentTime=Math.max(0,player.currentTime-10),
    ArrowRight:()=>player.currentTime=Math.min(Number.isFinite(player.duration)?player.duration:Infinity,player.currentTime+10),
    ' ':()=>player.paused?player.play().catch(()=>{}):player.pause(),
    j:()=>nudge(.1), k:()=>nudge(1), f:()=>nudge(-.1), d:()=>nudge(-1)};
  const action=actions[event.key.length===1?event.key.toLowerCase():event.key];
  if(action){event.preventDefault();action()}
});
function refreshTrack(){let old=player.querySelector('track');if(old)old.remove();let t=document.createElement('track');t.kind='subtitles';t.default=true;t.src='/api/subtitles?path='+encodeURIComponent(current)+'&offset='+off+'&auto='+(autoAlign.checked?'1':'0')+'&v='+Date.now();player.appendChild(t);if(t.track)t.track.mode='showing'}function nudge(x){off+=x;offset.textContent=Math.round(off*1000)+' ms';refreshTrack()}function closePreview(){current=null;videoStatus.hidden=true;load();player.pause();player.querySelectorAll('track').forEach(t=>t.remove());player.removeAttribute('src');player.load();if(preview.open)preview.close()}preview.addEventListener('cancel',e=>{e.preventDefault();closePreview()});async function decide(action){let r=await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:current,action,offset:off,auto_alignment:autoAlign.checked})});let d=await r.json();if(!r.ok){load();alert(d.error);return}if(action==='reject'){off=0;offset.textContent='0 ms';let x=await fetch('/api/cues?path='+encodeURIComponent(current));let nd=await x.json();updateCueData(nd);applyRecommendedOffset(nd);refreshTrack();player.play().catch(()=>{});load()}else{closePreview();load()}}load();</script>
